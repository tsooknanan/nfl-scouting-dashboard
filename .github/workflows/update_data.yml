name: Update NFL Stats

on:
  schedule:
    - cron: '0 8 * * 2'  # Runs automatically every Tuesday at 8:00 AM UTC
  workflow_dispatch:      # Adds a manual button so you can trigger it anytime

permissions:
  contents: write

jobs:
  refresh-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run data generation
        run: python generate_data.py

      - name: Commit and push updated JSON
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/nfl_data.json
          git commit -m "Auto-update NFL stats [skip ci]" || echo "No changes to commit"
          git push